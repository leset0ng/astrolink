[package]
name = "astrolink"
version = "0.1.1"
edition = "2021"
publish = false
description = "Astrolink module for Canopus"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
# The Canopus CLI selects exactly one exact-firmware feature for this dependency.
device = ["dep:canopus-target-generated"]
legacy-host = []
target-xiaomi-band-11-4-100-139 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-11-4-100-139"]
target-xiaomi-band-11-4-100-155 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-11-4-100-155"]
target-xiaomi-band-11-4-100-179 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-11-4-100-179"]
target-xiaomi-band-10-pro-3-101-036 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-10-pro-3-101-036"]
target-xiaomi-band-10-pro-3-101-043 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-10-pro-3-101-043"]
target-xiaomi-band-10-3-1-28 = ["legacy-host", "dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-10-3-1-28"]
target-xiaomi-band-9-3-1-32 = ["legacy-host", "dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-9-3-1-32"]
target-xiaomi-band-9-pro-3-1-190 = ["dep:canopus-target-generated", "canopus-target-generated/target-xiaomi-band-9-pro-3-1-190"]
target-redmi-watch-6-3-100-043 = ["legacy-host", "dep:canopus-target-generated", "canopus-target-generated/target-redmi-watch-6-3-100-043"]

[dependencies]
canopus-abi = { path = "../Canopus-Private/sdk/rust/canopus-abi" }
canopus-runtime = { path = "../Canopus-Private/sdk/rust/canopus-runtime" }
canopus-target-generated = { path = "../Canopus-Private/sdk/rust/canopus-target-generated", optional = true, default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

# Keep this module independent from the SDK workspace.
[workspace]
