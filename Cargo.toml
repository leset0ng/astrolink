[package]
name = "astrolink"
version = "0.1.0"
edition = "2021"
publish = false
description = "Astrolink module for Canopus"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
# The Canopus CLI selects the exact firmware feature for this dependency.
device = ["dep:canopus-target-generated"]

[dependencies]
canopus-abi = { path = "../Canopus-Private/sdk/rust/canopus-abi" }
canopus-runtime = { path = "../Canopus-Private/sdk/rust/canopus-runtime" }
canopus-target-generated = { path = "../Canopus-Private/sdk/rust/canopus-target-generated", optional = true, default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

# Keep this module independent from the SDK workspace.
[workspace]
