[package]
name = "astrolink"
version = "0.1.0"
edition = "2021"
publish = false
description = "Astrolink module for Canopus"

[lib]
crate-type = ["staticlib"]

[features]
default = []
# Turned on by `canopus build` for the device build. A target-bound module that
# calls firmware bindings adds the optional dependency
# `canopus-target-generated = { path = "../Canopus-Private/sdk/rust/canopus-target-generated", optional = true, default-features = false }`
# and lists "dep:canopus-target-generated" here; `canopus build` selects its exact target.
device = []

[dependencies]
canopus-abi = { path = "../Canopus-Private/sdk/rust/canopus-abi" }
canopus-runtime = { path = "../Canopus-Private/sdk/rust/canopus-runtime" }

# Keep this module independent from the SDK workspace.
[workspace]
